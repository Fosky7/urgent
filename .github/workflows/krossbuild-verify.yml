name: Kross Verify
# KrossBuild bundle-verification lane v8-ssr-lane
#
# Proves that a candidate tree really installs, typechecks and bundles BEFORE
# KrossBuild publishes it. Never deploys anything.

on:
  repository_dispatch:
    types: [ kross-verify ]

concurrency:
  group: kross-verify-${{ github.event.client_payload.project_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install + Typecheck + Bundle + Tests + A11y proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🔍 Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.checkout_ref }}

      - name: ⏱️ Start clock
        run: |
          echo "KROSS_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
          echo "KROSS_PHASE=checkout" >> "$GITHUB_ENV"

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: kross-bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/bun.lock', '**/package.json') }}
          restore-keys: kross-bun-${{ runner.os }}-

      - name: 📦 Install (real dependency proof)
        run: |
          set -eo pipefail
          echo install > /tmp/kross-phase
          echo "KROSS_PHASE=install" >> "$GITHUB_ENV"
          bun install 2>&1 | tee -a verify.log

      # The acceptance lane asserts that promised behaviour is backed by REAL
      # data, which means it must talk to the project's own backend exactly as
      # the app does. Vite also needs these baked into dist/ or the built app
      # boots without a client. Fetched with the low-privilege per-project
      # deploy token — never the service-role key — and exported so the
      # acceptance probe can re-query PostgREST as the anon role.
      - name: 🔐 Fetch project backend credentials
        continue-on-error: true
        env:
          VERIFY_URL: ${{ secrets.KROSS_VERIFY_URL }}
          PROJECT_ID: ${{ secrets.KROSS_PROJECT_ID }}
          DEPLOY_TOKEN: ${{ secrets.KROSS_DEPLOY_TOKEN }}
          ANON_KEY: ${{ secrets.KROSS_ANON_KEY }}
        run: |
          if [ -z "$VERIFY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::warning::KROSS_* secrets not configured — data-backed acceptance checks will be skipped."
            exit 0
          fi
          SECRETS_URL="${VERIFY_URL%/verify-bundle-callback}/get-build-secrets"
          HTTP=$(curl -sS -w "%{http_code}" -o secrets.json -X POST "$SECRETS_URL" \
            -H "apikey: $ANON_KEY" \
            -H "x-kross-deploy-token: $DEPLOY_TOKEN" \
            -H "content-type: application/json" \
            -d "{\"projectId\":\"$PROJECT_ID\"}") || HTTP=000
          if [ "$HTTP" -ge 300 ] || [ "$HTTP" = "000" ]; then
            echo "::warning::Could not fetch build secrets ($HTTP) — data-backed acceptance checks will be skipped."
            rm -f secrets.json; exit 0
          fi
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('secrets.json','utf8'));const d=(j.dotenv||'');fs.writeFileSync('.env',d+'\n');const out=[];for(const line of d.split('\n')){const m=line.match(/^\s*(VITE_SUPABASE_URL|VITE_SUPABASE_PUBLISHABLE_KEY|VITE_SUPABASE_ANON_KEY)\s*=\s*(.*)\s*$/);if(m)out.push(m[1]+'='+m[2].replace(/^['\"]|['\"]$/g,''));}fs.appendFileSync(process.env.GITHUB_ENV,out.join('\n')+(out.length?'\n':''));console.log('build secrets: '+(j.count||0)+', backend vars exported: '+out.length);"
          rm -f secrets.json


      - name: 🧠 Typecheck (advisory)
        continue-on-error: true
        run: |
          echo "KROSS_PHASE=typecheck" >> "$GITHUB_ENV"
          bunx tsc --noEmit 2>&1 | tee -a typecheck.log || true

      - name: 🏗️ Bundle (real vite build proof)
        run: |
          set -eo pipefail
          echo bundle > /tmp/kross-phase
          echo "KROSS_PHASE=bundle" >> "$GITHUB_ENV"
          NITRO_PRESET=netlify bunx --bun vite build 2>&1 | tee -a verify.log
          # Phase B4: a TanStack Start (SSR) build emits Nitro's .output/
          # instead of dist/. Accept either, and record which one so the serve
          # + probe steps below target the real artifact.
          if [ -d .output/public ]; then
            echo "KROSS_SSR=1" >> "$GITHUB_ENV"
            echo "SSR build output detected (.output/)"
          elif [ -d dist ]; then
            echo "KROSS_SSR=0" >> "$GITHUB_ENV"
          else
            echo "::error::vite build completed but produced neither dist/ nor .output/public"
            exit 1
          fi

      # ── F30: auto-generated smoke tests / route crawl ───────────────────
      # The suite is generated pre-commit from the router + each page's own
      # copy, and lives in the repo. Running it here is what turns it into
      # regression insurance: a later module cannot silently break an earlier
      # page without a named assertion going red.
      - name: 🧪 Smoke tests (route crawl + content pins)
        run: |
          set -eo pipefail
          echo tests > /tmp/kross-phase
          echo "KROSS_PHASE=tests" >> "$GITHUB_ENV"
          if [ -z "$(find src -name '*.test.*' -o -name '*.spec.*' 2>/dev/null | head -n 1)" ]; then
            echo "no test files present — skipping"; exit 0
          fi
          set +e
          bunx vitest run --reporter=json --outputFile=/tmp/kross-vitest.json --reporter=default 2>&1 | tee -a tests.log
          VITEST_EXIT=$?
          set -e
          if [ ! -s /tmp/kross-vitest.json ]; then
            echo "::warning::vitest produced no report (exit $VITEST_EXIT) — failing open"
            exit 0
          fi
          node -e "const r=require('/tmp/kross-vitest.json');process.exit(r.numFailedTests>0?1:0)"

      # ── F28: headless-browser boot assertion ────────────────────────────
      # Bundling proves the code COMPILES. This proves it RUNS: every declared
      # route is opened in real Chromium and asserted to mount without throwing.
      - name: ♻️ Restore Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: kross-playwright-${{ runner.os }}-1.49.1

      - name: 🎭 Install Chromium + axe-core (runtime + a11y probes)
        run: |
          set -eo pipefail
          npm i -D playwright@1.49.1 axe-core@4.10.2 --no-save 2>&1 | tail -n 5
          npx playwright install --with-deps chromium 2>&1 | tail -n 5

      - name: 🚀 Serve the built bundle
        run: |
          set -eo pipefail
          if [ "$KROSS_SSR" = "1" ] && [ -f .output/server/index.mjs ]; then
            echo "Booting the Nitro SSR server (.output/server/index.mjs)…"
            PORT=4173 HOST=127.0.0.1 nohup node .output/server/index.mjs > preview-server.log 2>&1 &
          else
            nohup npx vite preview --port 4173 --strictPort --host 127.0.0.1 > preview-server.log 2>&1 &
          fi
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null "http://127.0.0.1:4173/"; then
              echo "preview server up"; exit 0
            fi
            sleep 1
          done
          echo "::warning::preview server never came up; runtime probe will fail open"
          cat preview-server.log || true

      - name: 🧪 Boot assertion (every route, real browser)
        env:
          KROSS_PREVIEW_PORT: "4173"
        run: |
          echo runtime > /tmp/kross-phase
          echo "KROSS_PHASE=runtime" >> "$GITHUB_ENV"
          cat > /tmp/kross-runtime-probe.cjs <<'PROBEEOF'

          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const BASE = 'http://127.0.0.1:' + (process.env.KROSS_PREVIEW_PORT || '4173');
          const MAX_ROUTES = 14;
          const PER_ROUTE_MS = 12000;

          /** Walk src/ and mine every declared router path. */
          function discoverRoutes() {
            const roots = ['src'];
            const files = [];
            const walk = (dir) => {
              let entries = [];
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch (e) { return; }
              for (const e of entries) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) {
                  if (/^(node_modules|dist|build|\.git)$/.test(e.name)) continue;
                  walk(p);
                } else if (/\.(tsx|jsx|ts|js)$/.test(e.name)) {
                  files.push(p);
                }
              }
            };
            roots.forEach(walk);

            const found = new Set(['/']);

            // TanStack file-based routes: src/routes/about.tsx -> /about,
            // src/routes/index.tsx -> /. Dynamic ($id) and layout (__root, -private)
            // files are skipped; they are not directly navigable.
            for (const f of files) {
              const rel = f.replace(/\/g, '/');
              const m = rel.match(/^src/routes/(.+).(tsx|jsx)$/);
              if (!m) continue;
              const seg = m[1];
              if (seg.includes('$') || /(^|/)(__|-)/.test(seg)) continue;
              const r = '/' + seg.replace(/(^|/)index$/, '');
              found.add(r.replace(//+$/, '') || '/');
            }

            for (const f of files) {
              let src = '';
              try { src = fs.readFileSync(f, 'utf8'); } catch (e) { continue; }
              if (!/path\s*[:=]/.test(src)) continue;
              const patterns = [
                /path\s*=\s*["']([^"']+)["']/g,   // <Route path="/about" />
                /path\s*:\s*["']([^"']+)["']/g,   // { path: "/about" }
              ];
              for (const re of patterns) {
                let m;
                while ((m = re.exec(src))) {
                  let r = String(m[1] || '').trim();
                  if (!r || r === '*' || r.startsWith('http')) continue;
                  if (!r.startsWith('/')) r = '/' + r;
                  if (r.includes('*')) continue;
                  // Fill dynamic segments with a harmless placeholder so the route mounts.
                  r = r.replace(/:[A-Za-z0-9_]+/g, 'demo');
                  if (r.length > 80) continue;
                  found.add(r.replace(/\/+$/, '') || '/');
                }
              }
            }
            return Array.from(found).slice(0, MAX_ROUTES);
          }

          const NOISE = [
            /favicon/i,
            /Download the React DevTools/i,
            /React Router Future Flag/i,
            /Warning: ReactDOM.render/i,
            /source-?map/i,
            /\[vite\]/i,
          ];
          const isNoise = (s) => NOISE.some((re) => re.test(String(s || '')));

          async function probeRoute(browser, route) {
            const report = {
              route,
              status: 'mounted',
              pageErrors: [],
              consoleErrors: [],
              failedRequests: [],
              rootText: 0,
            };
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();

            page.on('pageerror', (err) => {
              const msg = (err && err.message) || String(err);
              if (!isNoise(msg)) {
                report.pageErrors.push({
                  message: msg.slice(0, 300),
                  stack: String((err && err.stack) || '').split('\n').slice(0, 4).join(' | ').slice(0, 400),
                });
              }
            });
            page.on('console', (msg) => {
              if (msg.type() !== 'error') return;
              const text = msg.text();
              if (isNoise(text)) return;
              report.consoleErrors.push(text.slice(0, 300));
            });
            page.on('requestfailed', (req) => {
              const url = req.url();
              if (isNoise(url)) return;
              report.failedRequests.push({
                url: url.slice(0, 200),
                reason: String((req.failure() && req.failure().errorText) || 'failed'),
              });
            });
            page.on('response', (res) => {
              if (res.status() < 500) return;
              report.failedRequests.push({ url: res.url().slice(0, 200), reason: 'HTTP ' + res.status() });
            });

            try {
              await page.goto(BASE + route, { waitUntil: 'networkidle', timeout: PER_ROUTE_MS });
            } catch (e) {
              // networkidle can legitimately time out on apps with long-polling; fall
              // back to a DOM-ready wait rather than declaring a false crash.
              try {
                await page.goto(BASE + route, { waitUntil: 'domcontentloaded', timeout: PER_ROUTE_MS });
              } catch (e2) {
                report.status = 'crashed';
                report.pageErrors.push({ message: 'Navigation failed: ' + String((e2 && e2.message) || e2).slice(0, 200), stack: '' });
              }
            }

            // Give effects/data a beat to run so post-paint throws are captured.
            await page.waitForTimeout(1800);

            try {
              const info = await page.evaluate(() => {
                const root = document.getElementById('root') || document.body;
                return {
                  text: (root && root.innerText ? root.innerText : '').trim().length,
                  nodes: root ? root.querySelectorAll('*').length : 0,
                };
              });
              report.rootText = info.text;
              if (report.status !== 'crashed' && info.text < 8 && info.nodes < 6) {
                report.status = 'crashed';
                report.pageErrors.push({ message: 'Route mounted nothing: #root rendered no visible content.', stack: '' });
              }
            } catch (e) {
              report.status = 'crashed';
              report.pageErrors.push({ message: 'DOM inspection failed: ' + String((e && e.message) || e).slice(0, 200), stack: '' });
            }

            if (report.status !== 'crashed' && report.pageErrors.length > 0) report.status = 'crashed';
            if (report.status === 'mounted' && (report.consoleErrors.length > 0 || report.failedRequests.length > 0)) {
              report.status = 'degraded';
            }

            await context.close();
            return report;
          }

          (async () => {
            const routes = discoverRoutes();
            const browser = await chromium.launch({ args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const reports = [];
            for (const route of routes) {
              try {
                reports.push(await probeRoute(browser, route));
              } catch (e) {
                reports.push({
                  route,
                  status: 'crashed',
                  pageErrors: [{ message: 'Probe failure: ' + String((e && e.message) || e).slice(0, 200), stack: '' }],
                  consoleErrors: [],
                  failedRequests: [],
                  rootText: 0,
                });
              }
            }
            await browser.close();

            const crashed = reports.filter((r) => r.status === 'crashed');
            const degraded = reports.filter((r) => r.status === 'degraded');

            const diagnostics = [];
            for (const r of crashed) {
              for (const p of r.pageErrors.slice(0, 2)) {
                diagnostics.push({
                  file: null,
                  line: null,
                  column: null,
                  code: 'RUNTIME_BOOT',
                  message: r.route + ' — ' + p.message + (p.stack ? ' (' + p.stack + ')' : ''),
                });
              }
              if (r.pageErrors.length === 0) {
                diagnostics.push({ file: null, line: null, column: null, code: 'RUNTIME_EMPTY', message: r.route + ' — rendered an empty page.' });
              }
            }
            for (const r of degraded.slice(0, 5)) {
              const first = r.consoleErrors[0] || (r.failedRequests[0] ? r.failedRequests[0].reason + ' ' + r.failedRequests[0].url : '');
              diagnostics.push({ file: null, line: null, column: null, code: 'RUNTIME_DEGRADED', message: r.route + ' — ' + String(first).slice(0, 300) });
            }

            const out = {
              status: crashed.length > 0 ? 'failed' : 'passed',
              routesChecked: reports.length,
              routesCrashed: crashed.length,
              routesDegraded: degraded.length,
              reports: reports.map((r) => ({
                route: r.route,
                status: r.status,
                consoleErrors: r.consoleErrors.slice(0, 3),
                failedRequests: r.failedRequests.slice(0, 3),
                pageErrors: r.pageErrors.slice(0, 2),
              })),
              diagnostics: diagnostics.slice(0, 30),
              summary:
                crashed.length > 0
                  ? crashed.length + ' of ' + reports.length + ' route(s) failed to boot: ' + crashed.map((r) => r.route).join(', ')
                  : reports.length + ' route(s) booted clean' + (degraded.length ? ' (' + degraded.length + ' with console/network warnings)' : '') + '.',
            };

            fs.writeFileSync('/tmp/kross-runtime.json', JSON.stringify(out));
            console.log(out.summary);
            process.exit(crashed.length > 0 ? 1 : 0);
          })().catch((e) => {
            // Probe infrastructure failure -> FAIL OPEN. We never block a publish on our
            // own tooling breaking; absence of evidence is not evidence of breakage.
            try {
              fs.writeFileSync('/tmp/kross-runtime.json', JSON.stringify({
                status: 'skipped',
                reason: String((e && e.message) || e).slice(0, 300),
                routesChecked: 0, routesCrashed: 0, routesDegraded: 0, reports: [], diagnostics: [],
                summary: 'Runtime boot probe could not run.',
              }));
            } catch (e2) { /* ignore */ }
            console.log('::warning::runtime boot probe skipped: ' + String((e && e.message) || e));
            process.exit(0);
          });

          PROBEEOF
          node /tmp/kross-runtime-probe.cjs 2>&1 | tee -a runtime.log

      # ── B4: server-render assertion (SSR trees only) ────────────────────
      # An SSR app that ships an empty shell and only paints after hydration is
      # strictly worse than the SPA it replaced: no first-paint content, no
      # crawlable HTML. This asserts the FIRST BYTE of each route already
      # contains real markup. Skipped entirely on static SPA builds.
      - name: 🌐 Server-render assertion
        if: env.KROSS_SSR == '1'
        env:
          KROSS_PREVIEW_PORT: "4173"
        run: |
          echo ssr > /tmp/kross-phase
          echo "KROSS_PHASE=ssr" >> "$GITHUB_ENV"
          cat > /tmp/kross-ssr-probe.cjs <<'SSREOF'

          const fs = require('fs');
          const PORT = process.env.KROSS_PREVIEW_PORT || '4173';
          const BASE = 'http://127.0.0.1:' + PORT;

          function routes() {
            const out = new Set(['/']);
            const walk = (dir, prefix) => {
              let ents = [];
              try { ents = fs.readdirSync(dir, { withFileTypes: true }); } catch (e) { return; }
              for (const e of ents) {
                if (e.isDirectory()) { walk(dir + '/' + e.name, prefix + '/' + e.name); continue; }
                if (!/\.(tsx|jsx)$/.test(e.name)) continue;
                const base = e.name.replace(/\.(tsx|jsx)$/, '');
                if (base.startsWith('__') || base.startsWith('-')) continue;
                if (base.includes('$')) continue;
                const p = (prefix + '/' + (base === 'index' ? '' : base)).replace(/\/+/g, '/');
                out.add(p.replace(/\/$/, '') || '/');
              }
            };
            walk('src/routes', '');
            return Array.from(out).slice(0, 12);
          }

          function strip(html) {
            return String(html || '')
              .replace(/<script[\s\S]*?<\/script>/gi, '')
              .replace(/<style[\s\S]*?<\/style>/gi, '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          }

          (async () => {
            const diagnostics = [];
            const reports = [];
            for (const route of routes()) {
              let html = '';
              let status = 0;
              try {
                const res = await fetch(BASE + route, { headers: { accept: 'text/html' } });
                status = res.status;
                html = await res.text();
              } catch (e) {
                diagnostics.push({ file: null, line: null, column: null, code: 'SSR_UNREACHABLE',
                  message: route + ' — SSR server did not answer: ' + String((e && e.message) || e).slice(0, 200) });
                reports.push({ route, status: 'crashed', chars: 0 });
                continue;
              }
              const text = strip(html);
              if (status >= 500) {
                diagnostics.push({ file: null, line: null, column: null, code: 'SSR_5XX',
                  message: route + ' — server rendered HTTP ' + status });
                reports.push({ route, status: 'crashed', chars: text.length });
                continue;
              }
              if (text.length < 20) {
                diagnostics.push({ file: null, line: null, column: null, code: 'SSR_EMPTY',
                  message: route + ' — server-rendered HTML is an empty shell (' + text.length + ' chars of text). ' +
                    'The page only appears after JS hydrates, so SSR is not actually working.' });
                reports.push({ route, status: 'crashed', chars: text.length });
                continue;
              }
              reports.push({ route, status: 'mounted', chars: text.length });
            }

            const crashed = reports.filter((r) => r.status === 'crashed');
            const out = {
              status: crashed.length > 0 ? 'failed' : 'passed',
              routesChecked: reports.length,
              routesCrashed: crashed.length,
              reports: reports,
              diagnostics: diagnostics.slice(0, 20),
              summary: crashed.length > 0
                ? crashed.length + ' of ' + reports.length + ' route(s) did not server-render: ' + crashed.map((r) => r.route).join(', ')
                : reports.length + ' route(s) server-rendered real HTML.',
            };
            fs.writeFileSync('/tmp/kross-ssr.json', JSON.stringify(out));
            console.log(out.summary);
            process.exit(crashed.length > 0 ? 1 : 0);
          })().catch((e) => {
            try {
              fs.writeFileSync('/tmp/kross-ssr.json', JSON.stringify({
                status: 'skipped', reason: String((e && e.message) || e).slice(0, 200),
                routesChecked: 0, routesCrashed: 0, reports: [], diagnostics: [],
                summary: 'SSR HTML probe could not run.',
              }));
            } catch (e2) { /* ignore */ }
            console.log('::warning::SSR probe skipped: ' + String((e && e.message) || e));
            process.exit(0);
          });

          SSREOF
          node /tmp/kross-ssr-probe.cjs 2>&1 | tee -a ssr.log

      # ── F31: accessibility + performance audit ──────────────────────────
      # Reuses the same Chromium and the same preview server. axe-core runs the
      # WCAG 2.1 A/AA rule set against every route's REAL rendered DOM, and
      # web-vitals are sampled from the same page load. Critical a11y
      # violations fail the job (phase a11y) and block the publish. The raw
      # perf numbers sampled here feed the blocking budget step below.
      - name: ♿ Accessibility + performance audit
        env:
          KROSS_PREVIEW_PORT: "4173"
        run: |
          echo a11y > /tmp/kross-phase
          echo "KROSS_PHASE=a11y" >> "$GITHUB_ENV"
          cat > /tmp/kross-a11y-probe.cjs <<'AXEEOF'

          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const BASE = 'http://127.0.0.1:' + (process.env.KROSS_PREVIEW_PORT || '4173');
          const MAX_ROUTES = 8;
          // G34 — every route is audited at Mobile, Tablet AND Desktop. Breakpoint-only
          // defects (a nav that never collapses, a 3-up grid at 390px, contrast that
          // only fails in the mobile header) are invisible to a single-width audit.
          const VIEWPORTS = [{"id":"mobile","label":"Mobile","width":390,"height":844,"isMobile":true},{"id":"tablet","label":"Tablet","width":834,"height":1112,"isMobile":true},{"id":"desktop","label":"Desktop","width":1440,"height":900,"isMobile":false}];
          const PER_ROUTE_MS = 15000;

          // Budgets. Deliberately generous: these are "this will hurt real users on a
          // phone" thresholds, not lab perfection.
          const LCP_BUDGET_MS = 4000;
          const CLS_BUDGET = 0.25;
          const PAGE_BYTES_BUDGET = 3500000;
          const IMAGE_BYTES_BUDGET = 900000;

          function resolveAxePath() {
            try { return require.resolve('axe-core/axe.min.js'); } catch (e) {}
            try { return require.resolve('axe-core/axe.js'); } catch (e) {}
            return null;
          }

          /** Same route discovery contract as the boot probe. */
          function discoverRoutes() {
            const files = [];
            const walk = (dir) => {
              let entries = [];
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch (e) { return; }
              for (const e of entries) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) {
                  if (/^(node_modules|dist|build|\.git)$/.test(e.name)) continue;
                  walk(p);
                } else if (/\.(tsx|jsx|ts|js)$/.test(e.name)) {
                  files.push(p);
                }
              }
            };
            walk('src');

            const found = new Set(['/']);
            for (const f of files) {
              let src = '';
              try { src = fs.readFileSync(f, 'utf8'); } catch (e) { continue; }
              if (!/path\s*[:=]/.test(src)) continue;
              const patterns = [/path\s*=\s*["']([^"']+)["']/g, /path\s*:\s*["']([^"']+)["']/g];
              for (const re of patterns) {
                let m;
                while ((m = re.exec(src))) {
                  let r = String(m[1] || '').trim();
                  if (!r || r === '*' || r.startsWith('http')) continue;
                  if (!r.startsWith('/')) r = '/' + r;
                  if (r.includes('*')) continue;
                  r = r.replace(/:[A-Za-z0-9_]+/g, 'demo');
                  if (r.length > 80) continue;
                  found.add(r.replace(/\/+$/, '') || '/');
                }
              }
            }
            return Array.from(found).slice(0, MAX_ROUTES);
          }

          const VITALS_SCRIPT = [
            '(() => {',
            '  window.__krossVitals = { lcp: 0, cls: 0 };',
            '  try {',
            '    new PerformanceObserver((l) => {',
            '      const es = l.getEntries();',
            '      const last = es[es.length - 1];',
            '      if (last) window.__krossVitals.lcp = last.renderTime || last.loadTime || last.startTime || 0;',
            '    }).observe({ type: "largest-contentful-paint", buffered: true });',
            '  } catch (e) {}',
            '  try {',
            '    new PerformanceObserver((l) => {',
            '      for (const e of l.getEntries()) {',
            '        if (!e.hadRecentInput) window.__krossVitals.cls += e.value;',
            '      }',
            '    }).observe({ type: "layout-shift", buffered: true });',
            '  } catch (e) {}',
            '})();',
          ].join('\n');

          async function auditRoute(browser, route, axePath, vp) {
            const report = {
              route,
              viewport: vp.id,
              viewportLabel: vp.label + ' ' + vp.width + 'x' + vp.height,
              violations: [],
              perf: { lcpMs: 0, cls: 0, bytes: 0, largestImageBytes: 0, largestImageUrl: null },
            };
            const context = await browser.newContext({
              viewport: { width: vp.width, height: vp.height },
              isMobile: !!vp.isMobile,
              hasTouch: !!vp.isMobile,
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            await page.addInitScript(VITALS_SCRIPT);

            page.on('response', async (res) => {
              try {
                const headers = res.headers();
                const len = Number(headers['content-length'] || 0);
                if (!len || !isFinite(len)) return;
                report.perf.bytes += len;
                const type = String(headers['content-type'] || '');
                if (/^image\//.test(type) && len > report.perf.largestImageBytes) {
                  report.perf.largestImageBytes = len;
                  report.perf.largestImageUrl = res.url().slice(0, 200);
                }
              } catch (e) {}
            });

            try {
              await page.goto(BASE + route, { waitUntil: 'networkidle', timeout: PER_ROUTE_MS });
            } catch (e) {
              try {
                await page.goto(BASE + route, { waitUntil: 'domcontentloaded', timeout: PER_ROUTE_MS });
              } catch (e2) {
                await context.close();
                return report; // boot failures belong to F28, not to this audit
              }
