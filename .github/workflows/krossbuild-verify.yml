          /**
           * One PostgREST read as the app's own anonymous role.
           * Returns { status, count, body }. count is -1 when unknown.
           */
          async function probeTable(table) {
            const url = DB_URL + '/rest/v1/' + encodeURIComponent(table) + '?select=*';
            const res = await fetch(url, {
              headers: {
                apikey: DB_KEY,
                Authorization: 'Bearer ' + DB_KEY,
                Accept: 'application/json',
                Prefer: 'count=exact',
                Range: '0-0',
              },
            });
