                  const nodes = (v.nodes || []).slice(0, 2).map((n) => String((n.target || []).join(' ')).slice(0, 120));
                  report.violations.push({
                    id: String(v.id || 'axe'),
                    impact: String(v.impact || 'minor'),
                    help: String(v.help || '').slice(0, 200),
                    count: (v.nodes || []).length,
                    targets: nodes,
                  });
                }
              } catch (e) {
                report.axeError = String((e && e.message) || e).slice(0, 200);
              }
            }

            await context.close();
            return report;
