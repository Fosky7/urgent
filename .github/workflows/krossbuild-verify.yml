          async function runCheck(page, check, errors) {
            const target = check.target || '';
            const route = check.route || '/';
            const url = BASE + (route === '/' ? '/' : route);
            const data = check.data || null;
            const canProbe = !!data && dataProbeAvailable();

            // Row count BEFORE the interaction, so a write criterion can be proven to
            // have actually written rather than merely to have shown a toast.
            let baseline = null;
            if (canProbe) {
              try {
                const p = await probeTable(data.table);
                const verdict = classifyProbe(p, data.table);
                if (verdict && verdict.cause === 'rls') {
                  return { ok: false, cause: 'rls', table: data.table, message: verdict.message };
                }
                if (verdict && verdict.ok) baseline = verdict.count;
              } catch (e) { baseline = null; }
            }

            const before = errors.length;
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 25000 });
            await page.waitForTimeout(700);

            if (!(await mounted(page))) {
              return { ok: false, message: 'the page did not render any content' };
            }

            if (check.kind === 'route') {
              return { ok: true };
            }

            if (check.kind === 'visible') {
              const text = await visibleText(page);
              const hit = text.toLowerCase().includes(String(target).toLowerCase());
              return hit ? { ok: true } : { ok: false, message: '"' + target + '" was not visible on ' + route };
            }

            if (check.kind === 'list') {
              const count = await page.evaluate(() => {
                const sels = ['ul > li', 'ol > li', '[role="list"] > *', 'tbody > tr', '[data-testid*="card"]', 'article'];
                let best = 0;
                for (const s of sels) {
