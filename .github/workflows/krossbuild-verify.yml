            const summary = failed > 0
              ? failed + ' of ' + ran + ' requested behaviours did not work in the real app.'
              : ran + ' requested behaviour(s) verified in a real browser.';

            write({ status, summary, total: ran, failed, diagnostics, reports: reports.slice(0, 40) });
            console.log('acceptance: ' + summary);
            process.exit(failed > 0 ? 1 : 0);
          })().catch((e) => {
            write({ status: 'unavailable', summary: 'acceptance probe crashed: ' + clean(e && e.message), total: 0, failed: 0, diagnostics: [], reports: [] });
            process.exit(0);
          });
          ACCEPTEOF
           node /tmp/kross-acceptance-probe.cjs 2>&1 | tee -a acceptance.log

      # ── COST / PERFORMANCE BUDGET (blocking) ────────────────────────────
      # Measures the REAL dist/ (gzipped JS/CSS, largest chunk, total output)
      # and joins it with the real page-weight / LCP / CLS numbers sampled by
      # the browser probe. Over the hard ceiling fails the job with phase
      # `perf`: the provisional commit is reverted and production is blocked.
      # Projects can raise or lower their own limits with kross.budget.json.
      - name: 📏 Performance + size budget
        run: |
          echo perf > /tmp/kross-phase
          echo "KROSS_PHASE=perf" >> "$GITHUB_ENV"
          cat > /tmp/kross-perf-probe.cjs <<'PERFEOF'

          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');

          const DEFAULTS = {"totalJsGzip":{"warn":700000,"max":1600000},"largestJsChunkGzip":{"warn":400000,"max":900000},"totalCssGzip":{"warn":120000,"max":300000},"totalDistRaw":{"warn":8000000,"max":20000000},"pageTransferBytes":{"warn":2500000,"max":4000000},"largestImageBytes":{"warn":900000,"max":2500000},"lcpMs":{"warn":4000,"max":8000},"cls":{"warn":0.25,"max":0.5}};

          function loadBudget() {
            const b = JSON.parse(JSON.stringify(DEFAULTS));
            let raw = null;
            try { raw = fs.readFileSync('kross.budget.json', 'utf8'); } catch (e) { raw = null; }
            if (!raw) return { budget: b, source: 'default' };
            let parsed = null;
            try { parsed = JSON.parse(raw); } catch (e) { return { budget: b, source: 'default (kross.budget.json is not valid JSON)' }; }
            for (const k of Object.keys(b)) {
              const v = parsed && parsed[k];
              if (!v) continue;
              if (typeof v === 'number') { b[k].max = v; b[k].warn = Math.round(v * 0.6 * 1000) / 1000; continue; }
              if (typeof v.max === 'number') b[k].max = v.max;
              if (typeof v.warn === 'number') b[k].warn = v.warn;
            }
            return { budget: b, source: 'kross.budget.json' };
          }

          function walk(dir, out) {
            let entries = [];
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch (e) { return out; }
            for (const e of entries) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) walk(p, out);
              else out.push(p);
            }
            return out;
          }

          function gzipSize(p) {
            try { return zlib.gzipSync(fs.readFileSync(p), { level: 9 }).length; } catch (e) { return 0; }
          }

          function fmt(n) {
            if (n >= 1048576) return (n / 1048576).toFixed(2) + 'MB';
            if (n >= 1024) return Math.round(n / 1024) + 'KB';
            return n + 'B';
          }

          (async () => {
            const loaded = loadBudget();
            const BUDGET = loaded.budget;

            if (!fs.existsSync('dist')) {
              fs.writeFileSync('/tmp/kross-perf.json', JSON.stringify({
                status: 'skipped', reason: 'no dist/ directory', budgetSource: loaded.source,
                metrics: {}, breaches: [], warnings: [], diagnostics: [],
                summary: 'Performance budget check skipped (no build output).',
              }));
              process.exit(0);
            }

            const files = walk('dist', []);
            let totalJsGzip = 0, totalCssGzip = 0, totalRaw = 0, largestChunk = 0, largestChunkName = '';
            const chunks = [];
            for (const f of files) {
              let size = 0;
              try { size = fs.statSync(f).size; } catch (e) { continue; }
              if (/\.map$/.test(f)) continue;
              totalRaw += size;
              if (/\.(js|mjs|cjs)$/.test(f)) {
                const g = gzipSize(f);
                totalJsGzip += g;
                chunks.push({ file: f.replace(/^dist\//, ''), raw: size, gzip: g });
                if (g > largestChunk) { largestChunk = g; largestChunkName = f.replace(/^dist\//, ''); }
              } else if (/\.css$/.test(f)) {
                totalCssGzip += gzipSize(f);
              }
            }
            chunks.sort((a, b) => b.gzip - a.gzip);

            // Runtime numbers sampled by the browser probe against the SERVED bundle.
            let a11y = null;
            try { a11y = JSON.parse(fs.readFileSync('/tmp/kross-a11y.json', 'utf8')); } catch (e) { a11y = null; }
            let pageTransferBytes = 0, pageTransferRoute = '', largestImageBytes = 0, largestImageRoute = '';
            let worstLcp = 0, worstLcpRoute = '', worstCls = 0, worstClsRoute = '';
            const reports = (a11y && Array.isArray(a11y.reports)) ? a11y.reports : [];
            for (const r of reports) {
              const p = (r && r.perf) || {};
              const tag = (r.viewportLabel ? '[' + r.viewportLabel + '] ' : '') + (r.route || '/');
              if ((p.bytes || 0) > pageTransferBytes) { pageTransferBytes = p.bytes || 0; pageTransferRoute = tag; }
              if ((p.largestImageBytes || 0) > largestImageBytes) { largestImageBytes = p.largestImageBytes || 0; largestImageRoute = tag; }
              if ((p.lcpMs || 0) > worstLcp) { worstLcp = p.lcpMs || 0; worstLcpRoute = tag; }
              if ((p.cls || 0) > worstCls) { worstCls = p.cls || 0; worstClsRoute = tag; }
            }

            const metrics = {
              totalJsGzip: { value: totalJsGzip, where: chunks.length + ' JS chunk(s)' },
              largestJsChunkGzip: { value: largestChunk, where: largestChunkName },
              totalCssGzip: { value: totalCssGzip, where: 'stylesheets' },
              totalDistRaw: { value: totalRaw, where: files.length + ' build file(s)' },
              pageTransferBytes: { value: pageTransferBytes, where: pageTransferRoute },
              largestImageBytes: { value: largestImageBytes, where: largestImageRoute },
              lcpMs: { value: Math.round(worstLcp), where: worstLcpRoute },
              cls: { value: Math.round(worstCls * 1000) / 1000, where: worstClsRoute },
            };

            const LABEL = {
              totalJsGzip: 'total JavaScript (gzipped)',
              largestJsChunkGzip: 'largest JavaScript chunk (gzipped)',
              totalCssGzip: 'total CSS (gzipped)',
              totalDistRaw: 'total build output',
              pageTransferBytes: 'heaviest page download',
              largestImageBytes: 'largest image',
              lcpMs: 'slowest largest-contentful-paint',
              cls: 'worst layout shift',
            };
            const TIME_OR_SCORE = { lcpMs: 1, cls: 1 };
            const show = (k, v) => TIME_OR_SCORE[k] ? (k === 'lcpMs' ? Math.round(v) + 'ms' : String(v)) : fmt(v);

            const breaches = [];
            const warnings = [];
            const diagnostics = [];
            for (const k of Object.keys(BUDGET)) {
              const m = metrics[k];
              if (!m) continue;
              // A metric the browser probe never produced (0) is not evidence of speed;
              // it is absence of measurement. Never fail on it.
              if (!m.value) continue;
              const b = BUDGET[k];
              const where = m.where ? ' (' + m.where + ')' : '';
              if (m.value > b.max) {
                breaches.push({ metric: k, value: m.value, budget: b.max, where: m.where || null });
                diagnostics.push({
                  file: k === 'largestJsChunkGzip' && m.where ? null : null,
                  line: null, column: null, code: 'PERF_BUDGET',
                  message: LABEL[k] + ' is ' + show(k, m.value) + where + ', over the hard limit of ' + show(k, b.max) + '. This is too heavy to ship.',
                });
              } else if (m.value > b.warn) {
                warnings.push({ metric: k, value: m.value, budget: b.warn, where: m.where || null });
                diagnostics.push({
                  file: null, line: null, column: null, code: 'PERF_BUDGET_WARN',
                  message: LABEL[k] + ' is ' + show(k, m.value) + where + ', above the comfortable limit of ' + show(k, b.warn) + ' (still under the hard limit).',
                });
              }
            }

            const topChunks = chunks.slice(0, 5).map((c) => c.file + ' ' + fmt(c.gzip));
            const out = {
              status: breaches.length ? 'failed' : 'passed',
              budgetSource: loaded.source,
              metrics: metrics,
              budget: BUDGET,
              breaches: breaches,
              warnings: warnings,
              topChunks: topChunks,
              diagnostics: diagnostics.slice(0, 20),
              summary: breaches.length
                ? breaches.length + ' performance budget(s) exceeded: ' + breaches.map((b) => LABEL[b.metric] + ' ' + show(b.metric, b.value) + ' > ' + show(b.metric, b.budget)).join('; ')
                : 'Within performance budget (' + fmt(totalJsGzip) + ' JS gzipped'
                  + (pageTransferBytes ? ', ' + fmt(pageTransferBytes) + ' heaviest page' : '') + ')'
                  + (warnings.length ? ', ' + warnings.length + ' near-limit warning(s)' : '') + '.',
            };
            fs.writeFileSync('/tmp/kross-perf.json', JSON.stringify(out));
            console.log(out.summary);
            if (breaches.length) {
              for (const d of out.diagnostics) console.log('::error::' + d.message);
            }
            process.exit(breaches.length ? 1 : 0);
          })().catch((e) => {
            try {
              fs.writeFileSync('/tmp/kross-perf.json', JSON.stringify({
                status: 'skipped', reason: String((e && e.message) || e).slice(0, 300),
                metrics: {}, breaches: [], warnings: [], diagnostics: [],
                summary: 'Performance budget check could not run.',
              }));
            } catch (e2) {}
            console.log('::warning::perf budget check skipped: ' + String((e && e.message) || e));
            process.exit(0);
          });

          PERFEOF
          node /tmp/kross-perf-probe.cjs 2>&1 | tee -a perf.log







      - name: 📮 Report verdict to KrossBuild
        if: always()
        env:
          VERIFY_URL: ${{ secrets.KROSS_VERIFY_URL }}
          DEPLOY_TOKEN: ${{ secrets.KROSS_DEPLOY_TOKEN }}
          ANON_KEY: ${{ secrets.KROSS_ANON_KEY }}
          PROJECT_ID: ${{ secrets.KROSS_PROJECT_ID }}
          VERIFICATION_ID: ${{ github.event.client_payload.verification_id }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$VERIFY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::warning::KROSS_VERIFY_URL / KROSS_DEPLOY_TOKEN not configured — cannot report verdict."
            exit 0
          fi
          cat > /tmp/kross-parse.cjs <<'PARSEEOF'
          const fs = require('fs');
          const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
          const buildLog = read('verify.log');
          const typeLog = read('typecheck.log');
          const diagnostics = [];
          const push = (d) => {
            if (diagnostics.length >= 40) return;
            if (diagnostics.some((x) => x.file === d.file && x.line === d.line && x.message === d.message)) return;
            diagnostics.push(d);
          };
          const clean = (s) => String(s || '').replace(/\u001b\[[0-9;]*m/g, '').trim().slice(0, 400);

          // tsc:  src/App.tsx(12,3): error TS2322: Type 'x' is not assignable...
          for (const m of typeLog.matchAll(/^(.+?)\((\d+),(\d+)\):\s+error\s+(TS\d+):\s*(.+)$/gm)) {
            push({ file: clean(m[1]), line: Number(m[2]), column: Number(m[3]), code: m[4], message: clean(m[5]) });
          }
          // rollup: Could not resolve "./x" from "src/y.tsx"
          for (const m of buildLog.matchAll(/Could not resolve ["']([^"']+)["'] from ["']([^"']+)["']/g)) {
            push({ file: clean(m[2]), line: null, column: null, code: 'ROLLUP_UNRESOLVED', message: 'Could not resolve "' + clean(m[1]) + '"' });
          }
          // esbuild: src/x.ts:12:4: ERROR: message
          for (const m of buildLog.matchAll(/^(.+?):(\d+):(\d+):\s*(?:ERROR|error):\s*(.+)$/gm)) {
            push({ file: clean(m[1]), line: Number(m[2]), column: Number(m[3]), code: 'ESBUILD', message: clean(m[4]) });
          }
          // bun install failures
          for (const m of buildLog.matchAll(/error:\s*(.*(?:not found|failed to resolve|No version matching|EACCES|ENOTFOUND).*)$/gim)) {
            push({ file: 'package.json', line: null, column: null, code: 'INSTALL', message: clean(m[1]) });
          }
          // Generic vite/rollup error lines as a last resort.
          if (!diagnostics.length) {
            for (const m of buildLog.matchAll(/^(?:\[vite\][^\n]*|error during build:[^\n]*|RollupError:[^\n]*|Error:[^\n]*)$/gm)) {
              push({ file: null, line: null, column: null, code: 'BUILD', message: clean(m[0]) });
            }
          }

          // F30 — vitest smoke-suite verdict (named assertions).
          let tests = null;
          try { tests = JSON.parse(read('/tmp/kross-vitest.json') || 'null'); } catch { tests = null; }
          if (tests && Array.isArray(tests.testResults)) {
            for (const suite of tests.testResults) {
              for (const a of (suite.assertionResults || [])) {
                if (a.status !== 'failed') continue;
                const detail = clean((a.failureMessages || [])[0] || '').split('\n')[0];
                push({
                  file: clean(suite.name || '').replace(process.cwd() + '/', '') || null,
                  line: null, column: null, code: 'TEST',
                  message: clean((a.fullName || a.title || 'test') + ' — ' + detail),
                });
              }
            }
          }
          const failedTests = tests && typeof tests.numFailedTests === 'number' ? tests.numFailedTests : 0;

          // F28 — runtime boot verdict (per-route, real browser).
          let runtime = null;
          try { runtime = JSON.parse(read('/tmp/kross-runtime.json') || 'null'); } catch { runtime = null; }
          if (runtime && Array.isArray(runtime.diagnostics)) {
            for (const d of runtime.diagnostics) {
              push({ file: d.file || null, line: d.line || null, column: d.column || null, code: d.code || 'RUNTIME', message: clean(d.message) });
            }
          }


          // B4 — server-render verdict (SSR trees only).
          let ssr = null;
          try { ssr = JSON.parse(read('/tmp/kross-ssr.json') || 'null'); } catch { ssr = null; }
          if (ssr && Array.isArray(ssr.diagnostics)) {
            for (const d of ssr.diagnostics) {
              push({ file: null, line: null, column: null, code: d.code || 'SSR', message: clean(d.message) });
            }
          }

          // F31 — accessibility + performance audit (axe-core + web vitals).
          let a11y = null;
          try { a11y = JSON.parse(read('/tmp/kross-a11y.json') || 'null'); } catch { a11y = null; }
          if (a11y && Array.isArray(a11y.diagnostics)) {
            for (const d of a11y.diagnostics) {
              push({ file: d.file || null, line: d.line || null, column: d.column || null, code: d.code || 'A11Y', message: clean(d.message) });
            }
          }

          // COST / PERF BUDGET — real dist/ measurement + real page weight.
          let perf = null;
          try { perf = JSON.parse(read('/tmp/kross-perf.json') || 'null'); } catch { perf = null; }
          if (perf && Array.isArray(perf.diagnostics)) {
            for (const d of perf.diagnostics) {
              push({ file: d.file || null, line: null, column: null, code: d.code || 'PERF_BUDGET', message: clean(d.message) });
            }
          }

          // GAP #1 — semantic acceptance verdict (real browser, real behaviour).
          let acceptance = null;
          try { acceptance = JSON.parse(read('/tmp/kross-acceptance.json') || 'null'); } catch { acceptance = null; }
          if (acceptance && Array.isArray(acceptance.diagnostics)) {
            for (const d of acceptance.diagnostics) {
              push({ file: d.file || null, line: null, column: null, code: d.code || 'ACCEPT', message: clean(d.message) });
            }
          }

          const status = process.env.JOB_STATUS === 'success' ? 'passed' : 'failed';
          let phase = null;
          if (status !== 'passed') phase = clean(read('/tmp/kross-phase')) || process.env.KROSS_PHASE || 'bundle';
          const started = Number(process.env.KROSS_STARTED_AT || 0);
          const durationMs = started ? Date.now() - started : null;
          const runtimeSummary = runtime && runtime.summary ? ' ' + runtime.summary : '';
          const a11ySummary = a11y && a11y.summary ? ' ' + a11y.summary : '';
          const acceptSummary = acceptance && acceptance.summary ? ' ' + acceptance.summary : '';
          const perfSummary = perf && perf.summary ? ' ' + perf.summary : '';
          const testSummary = tests && typeof tests.numTotalTests === 'number'
            ? ' ' + (tests.numTotalTests - failedTests) + '/' + tests.numTotalTests + ' smoke checks passed.'
            : '';
          const summary = status === 'passed'
            ? ('Real install + vite build succeeded.' + testSummary + runtimeSummary + a11ySummary + acceptSummary + perfSummary).slice(0, 600)
            : (phase === 'ssr'
                ? ('The app did not server-render real HTML.' + (ssr && ssr.summary ? ' ' + ssr.summary : ''))
              : phase === 'runtime'
                ? ('App failed to boot in a real browser.' + runtimeSummary)
                : phase === 'a11y'
                  ? ((a11y && a11y.criticalCount ? a11y.criticalCount : 'Some') + ' critical accessibility issue(s) found in the rendered app.')
                : phase === 'perf'
                  ? ('The app is over its size/speed budget and would be painfully slow for real users.' + perfSummary)
                : phase === 'acceptance'
                  ? ((acceptance && acceptance.failed ? acceptance.failed : 'Some') + ' of the things you asked for are not working in the built app.' + acceptSummary)
                : phase === 'tests'
                  ? (failedTests + ' smoke test(s) failed — a previously working part of the app broke.')
                  : 'Bundle verification failed during ' + phase + (diagnostics.length ? ' (' + diagnostics.length + ' diagnostic(s)).' : '.')).slice(0, 600);


          fs.writeFileSync('/tmp/kross-verdict.json', JSON.stringify({
            verificationId: process.env.VERIFICATION_ID || null,
            projectId: process.env.PROJECT_ID || null,
            status,
            phase,
            diagnostics,
            summary,
            runUrl: process.env.RUN_URL || null,
            durationMs,
            tests: tests ? {
              total: tests.numTotalTests || 0,
              failed: failedTests,
              suites: (tests.testResults || []).length,
            } : null,
            runtime: runtime ? {
              status: runtime.status,
              routesChecked: runtime.routesChecked,
              routesCrashed: runtime.routesCrashed,
              routesDegraded: runtime.routesDegraded,
              reports: (runtime.reports || []).slice(0, 20),
              summary: runtime.summary,
            } : null,
            a11y: a11y ? {
              status: a11y.status,
              routesAudited: a11y.routesAudited,
              criticalCount: a11y.criticalCount,
              seriousCount: a11y.seriousCount,
              perfWarnings: a11y.perfWarnings,
              worstLcpMs: a11y.worstLcpMs,
              reports: (a11y.reports || []).slice(0, 30),
              summary: a11y.summary,
            } : null,
            perf: perf ? {
              status: perf.status,
              budgetSource: perf.budgetSource || null,
              metrics: perf.metrics || {},
              breaches: (perf.breaches || []).slice(0, 12),
              warnings: (perf.warnings || []).slice(0, 12),
              topChunks: (perf.topChunks || []).slice(0, 5),
              summary: perf.summary,
            } : null,
            acceptance: acceptance ? {
              status: acceptance.status,
              total: acceptance.total || 0,
              passed: acceptance.passed || 0,
              failed: acceptance.failed || 0,
              reports: (acceptance.reports || []).slice(0, 20),
              summary: acceptance.summary,
            } : null,
            logTail: (buildLog + '\n' + typeLog).slice(-6000),
          }));
          console.log(summary);
          PARSEEOF
          node /tmp/kross-parse.cjs
          curl -sS -X POST "$VERIFY_URL" \
            -H "apikey: $ANON_KEY" \
            -H "x-kross-deploy-token: $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/kross-verdict.json || true
          echo "Reported verdict to KrossBuild."

      - name: 🧹 Delete candidate ref
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.client_payload.checkout_ref }}
        run: |
          if [ -n "$REF" ] && [ -n "$GH_TOKEN" ]; then
            curl -sS -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/git/refs/heads/$REF" || true
          fi
