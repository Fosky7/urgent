                return {
                  ok: false, cause: 'data-fake', table: data.table,
                  message: 'the ' + (target || 'list') + ' on ' + route + ' shows items, but "' + data.table +
                    '" has no rows readable by the app — the page is rendering placeholder data, not real data',
