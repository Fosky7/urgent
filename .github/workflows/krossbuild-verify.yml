          (async () => {
            const axePath = resolveAxePath();
            if (!axePath) console.log('::warning::axe-core not resolvable — accessibility audit will be skipped');

            const routes = discoverRoutes();
            const browser = await chromium.launch({ args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const reports = [];
            for (const vp of VIEWPORTS) {
              for (const route of routes) {
                try {
                  reports.push(await auditRoute(browser, route, axePath, vp));
                } catch (e) {
                  reports.push({
                    route,
                    viewport: vp.id,
                    viewportLabel: vp.label + ' ' + vp.width + 'x' + vp.height,
                    violations: [],
                    perf: { lcpMs: 0, cls: 0, bytes: 0, largestImageBytes: 0 },
                    probeError: String((e && e.message) || e).slice(0, 200),
                  });
                }
              }
            }
            await browser.close();

            const diagnostics = [];
            const seen = new Set();
            let critical = 0;
            let serious = 0;

            for (const r of reports) {
              for (const v of r.violations) {
                const key = v.id + '|' + v.impact + '|' + (r.viewport || 'desktop');
                const blocking = v.impact === 'critical';
                if (blocking) critical += v.count;
                else if (v.impact === 'serious') serious += v.count;
                if (seen.has(key)) continue;
                seen.add(key);
                diagnostics.push({
                  file: null, line: null, column: null,
                  code: blocking ? 'A11Y_CRITICAL' : 'A11Y',
                  message: '[' + (r.viewportLabel || 'Desktop') + '] ' + r.route + ' — [' + v.impact + '] ' + v.help + ' (' + v.count + ' element(s), e.g. ' + (v.targets[0] || 'n/a') + ')',
                });
              }
            }

            const perfNotes = [];
            for (const r of reports) {
              const p = r.perf || {};
              const vpTag = '[' + (r.viewportLabel || 'Desktop') + '] ';
              if (r.overflowPx && r.overflowPx > 4) {
                perfNotes.push({ code: 'LAYOUT_OVERFLOW', message: vpTag + r.route + ' — the page scrolls sideways by ' + r.overflowPx + 'px at this width; something is wider than the screen.' });
              }
              if (p.lcpMs > LCP_BUDGET_MS) {
                perfNotes.push({ code: 'PERF_LCP', message: vpTag + r.route + ' — largest content painted in ' + Math.round(p.lcpMs) + 'ms (budget ' + LCP_BUDGET_MS + 'ms).' });
              }
              if (p.cls > CLS_BUDGET) {
                perfNotes.push({ code: 'PERF_CLS', message: vpTag + r.route + ' — layout shifts of ' + p.cls + ' (budget ' + CLS_BUDGET + '); reserve space for images and fonts.' });
              }
              if (p.largestImageBytes > IMAGE_BYTES_BUDGET) {
                perfNotes.push({ code: 'PERF_IMAGE', message: vpTag + r.route + ' — one image is ' + Math.round(p.largestImageBytes / 1024) + 'KB (' + (p.largestImageUrl || '') + '); convert to WebP/AVIF and size it correctly.' });
              }
              if (p.bytes > PAGE_BYTES_BUDGET) {
                perfNotes.push({ code: 'PERF_WEIGHT', message: vpTag + r.route + ' — page transfers ' + Math.round(p.bytes / 1024) + 'KB; split the bundle or lazy-load below-the-fold work.' });
              }
            }
            for (const n of perfNotes.slice(0, 14)) {
              diagnostics.push({ file: null, line: null, column: null, code: n.code, message: n.message });
            }

            const worstLcp = reports.reduce((a, r) => Math.max(a, (r.perf && r.perf.lcpMs) || 0), 0);
            const uniqueRoutes = new Set(reports.map((r) => r.route)).size;
            const out = {
              status: critical > 0 ? 'failed' : 'passed',
              routesAudited: reports.length,
              uniqueRoutes: uniqueRoutes,
              viewportsAudited: VIEWPORTS.map((v) => v.id),
              overflowViewports: Array.from(new Set(reports.filter((r) => (r.overflowPx || 0) > 4).map((r) => r.viewport))),
              criticalCount: critical,
              seriousCount: serious,
              perfWarnings: perfNotes.length,
              worstLcpMs: worstLcp,
              reports: reports.map((r) => ({
                route: r.route,
                viewport: r.viewport,
                viewportLabel: r.viewportLabel,
                overflowPx: r.overflowPx || 0,
                perf: r.perf,
                violations: (r.violations || []).slice(0, 6),
              })),
              diagnostics: diagnostics.slice(0, 30),
              summary:
                critical > 0
                  ? critical + ' critical accessibility issue(s) across ' + uniqueRoutes + ' page(s) x ' + VIEWPORTS.length + ' viewport(s).'
                  : uniqueRoutes + ' page(s) audited at ' + VIEWPORTS.map((v) => v.label).join('/') + ': no critical accessibility issues'
                    + (serious ? ', ' + serious + ' serious issue(s) noted' : '')
                    + (perfNotes.length ? ', ' + perfNotes.length + ' performance warning(s)' : '')
                    + '.',
            };

            fs.writeFileSync('/tmp/kross-a11y.json', JSON.stringify(out));
            console.log(out.summary);
            process.exit(critical > 0 ? 1 : 0);
          })().catch((e) => {
            try {
              fs.writeFileSync('/tmp/kross-a11y.json', JSON.stringify({
                status: 'skipped',
                reason: String((e && e.message) || e).slice(0, 300),
                routesAudited: 0, uniqueRoutes: 0, viewportsAudited: [], criticalCount: 0, seriousCount: 0, perfWarnings: 0,
                reports: [], diagnostics: [], summary: 'Accessibility audit could not run.',
              }));
            } catch (e2) {}
            console.log('::warning::a11y/perf audit skipped: ' + String((e && e.message) || e));
            process.exit(0);
          });

          AXEEOF
          node /tmp/kross-a11y-probe.cjs 2>&1 | tee -a a11y.log

      # ── GAP #1 — SEMANTIC ACCEPTANCE ────────────────────────────────────
      # Everything above proves the app BUILDS and BOOTS. This proves it does
      # what the user actually asked for: the plan's acceptance criteria were
      # compiled into .kross/acceptance.json and are replayed here against
      # the real rendered app. A failure here means the feature is missing or
      # broken, even though the code compiles — and it blocks the publish.
      - name: ✅ Acceptance checks (does it do what was asked?)
        if: hashFiles('.kross/acceptance.json') != ''
        env:
          KROSS_PREVIEW_PORT: "4173"
        run: |
          echo acceptance > /tmp/kross-phase
          echo "KROSS_PHASE=acceptance" >> "$GITHUB_ENV"
          cat > /tmp/kross-acceptance-probe.cjs <<'ACCEPTEOF'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const PORT = process.env.KROSS_PREVIEW_PORT || '4173';
          const BASE = 'http://127.0.0.1:' + PORT;
          const OUT = '/tmp/kross-acceptance.json';
          const MANIFEST = path.join(process.cwd(), '.kross/acceptance.json');

          function write(payload) {
            try { fs.writeFileSync(OUT, JSON.stringify(payload)); } catch (e) {}
          }

          function clean(s) {
            return String(s == null ? '' : s).replace(/\u001b\[[0-9;]*m/g, '').replace(/\s+/g, ' ').trim().slice(0, 300);
          }

          async function mounted(page) {
            return await page.evaluate(() => {
              const root = document.getElementById('root') || document.body;
              return !!root && root.innerHTML.trim().length > 30;
            }).catch(() => false);
          }

          async function visibleText(page) {
            return await page.evaluate(() => (document.body && document.body.innerText) || '').catch(() => '');
          }

          async function findByName(page, name) {
            const escaped = String(name).replace(/["\\]/g, '\\$&');
            const candidates = [
              page.getByRole('button', { name: new RegExp(escapeRe(name), 'i') }),
              page.getByRole('link', { name: new RegExp(escapeRe(name), 'i') }),
              page.getByLabel(new RegExp(escapeRe(name), 'i')),
              page.getByPlaceholder(new RegExp(escapeRe(name), 'i')),
              page.getByText(new RegExp(escapeRe(name), 'i')),
              page.locator('[aria-label*="' + escaped + '" i]'),
            ];
            for (const c of candidates) {
              try {
                const n = await c.count();
                if (n > 0) return c.first();
              } catch (e) {}
            }
            return null;
          }

          function escapeRe(s) {
            return String(s).replace(/[.*+?^$\{\}()|[\]\\]/g, '\\$&');
          }

          // ---------------------------------------------------------------------------
          // DATA ASSERTIONS — the RLS query proof lane, executed inside the acceptance
          // run. Credentials come from the CI environment, never from the manifest.
          // ---------------------------------------------------------------------------

          const DB_URL = (process.env.VITE_SUPABASE_URL || process.env.SUPABASE_URL || '').replace(/\/+$/, '');
          const DB_KEY =
            process.env.VITE_SUPABASE_PUBLISHABLE_KEY ||
            process.env.VITE_SUPABASE_ANON_KEY ||
            process.env.SUPABASE_ANON_KEY ||
            '';

