          /** Classify a probe into a verdict the self-heal ladder can act on. */
          function classifyProbe(p, table) {
            if (p.status === 404 || /does not exist/i.test(p.body)) {
              return { cause: 'rls', message: 'the "' + table + '" table does not exist in the database' };
            }
            if (p.status === 401 || p.status === 403 || /permission denied/i.test(p.body)) {
              return { cause: 'rls', message: 'the database refuses to read "' + table + '" for the app (HTTP ' + p.status + ') — grants or policies are missing' };
            }
            if (p.status < 200 || p.status >= 300) {
              return null; // infrastructure noise: never a product failure
            }
            return { ok: true, count: p.count };
