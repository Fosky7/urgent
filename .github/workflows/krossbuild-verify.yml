            // width? That is the single most common "it looks broken on my phone" defect
            // and it needs no vision model to detect.
            try {
              report.overflowPx = await page.evaluate(() => {
                const de = document.documentElement;
                return Math.max(0, Math.round(de.scrollWidth - de.clientWidth));
